name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build, lint, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  python:
    name: Python analytics and API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m py_compile analytics/*.py scripts/railway_admin.py
      - run: python -m unittest discover -s analytics -v

  railway-image:
    name: Railway image build and runtime smoke test
    runs-on: ubuntu-latest
    needs: [frontend, python]
    steps:
      - uses: actions/checkout@v6
      - name: Build Railway Docker image
        run: docker build --tag aurum-spread:ci .
      - name: Verify Caddy and Python health endpoint
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm --name aurum-spread-ci --publish 3000:3000 --env PORT=3000 aurum-spread:ci
          cleanup() { docker stop aurum-spread-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health > /tmp/aurum-health.json; then
              break
            fi
            sleep 1
          done
          python -c 'import json; from pathlib import Path; p=json.loads(Path("/tmp/aurum-health.json").read_text()); assert p["status"] == "ok"; assert p["service"] == "aurum-spread-python"; assert p["storage_writable"]'
          curl --fail --silent http://127.0.0.1:3000/ | grep --quiet 'Aurum Spread'
