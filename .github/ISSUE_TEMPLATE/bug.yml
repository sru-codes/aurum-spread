name: Bug report
description: Report a reproducible product, analytics, or data-quality defect.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here; follow SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest safe fixture and exact steps. Do not attach credentials or private datasets.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Dashboard, Data parsing, Normalization, Signal logic, Backtest, Railway deployment, Documentation]
    validations:
      required: true
